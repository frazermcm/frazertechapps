<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4C5EC"/>
      <stop offset="50%" stop-color="#9BB3D4"/>
      <stop offset="100%" stop-color="#A8D9C7"/>
    </linearGradient>
    <linearGradient id="hangerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F2EBD8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bgGrad)"/>
  <!-- Soft inner glow -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bgGlow)"/>

  <!-- Hanger triangle (drawn first) -->
  <g filter="url(#softShadow)">
    <path d="M 212 670 L 512 430 L 812 670 Z"
          fill="none"
          stroke="url(#hangerGrad)"
          stroke-width="46"
          stroke-linejoin="round"/>
    <!-- Hook: clean J-shape -->
    <path d="M 512 430 L 512 348 A 42 42 0 1 1 596 348 L 596 372"
          fill="none"
          stroke="url(#hangerGrad)"
          stroke-width="46"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Sparkle accent (4-point star) -->
  <g fill="url(#hangerGrad)" opacity="0.92">
    <path d="M 800 230
             C 803 268, 822 287, 860 290
             C 822 293, 803 312, 800 350
             C 797 312, 778 293, 740 290
             C 778 287, 797 268, 800 230 Z"/>
  </g>
</svg>
